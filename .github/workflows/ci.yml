name: ci
on:
  push:
    branches: [main, "ci/**"]
  pull_request:

jobs:
  test:
    name: test (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: rustup show   # honours rust-toolchain.toml
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: build
        run: cargo build --locked
      # The `if: hashFiles(...)` guards these two steps carried until P5 are
      # GONE. They existed because nextest exits 4 on a workspace with no tests,
      # which would have made CI red from the first commit -- but a conditional
      # step prints a green tick when it is SKIPPED, so from P1 onward the guard
      # was a gate that could silently stop running. There are tests now, and an
      # unconditional step is the only kind whose green means anything.
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - name: test
        run: cargo nextest run --locked

      # P5's two gates. Both are cheap and both catch a failure no test can:
      # a refusal added to the spec with no test, and a refusal test that would
      # pass against code with its check deleted.
      - name: refusal coverage (bijection with refusals.toml)
        run: ./scripts/check-refusal-coverage.sh
      - name: refusal mutation (every refusal test can fail)
        run: ./scripts/mutate-refusals.sh

      # P6's acceptance runs. They assert on WHAT THE OPERATOR SEES, which the
      # test suite deliberately does not: a journey that checks only exit codes
      # passes against a tool that succeeds in silence, and all three of these
      # are about moments where the output IS the deliverable.
      - name: journeys (encode, recover, miscut)
        run: ./scripts/journeys.sh
