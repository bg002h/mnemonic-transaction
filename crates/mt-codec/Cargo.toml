[package]
name = "mt-codec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference implementation of the mt1 format — engravable codex32 backups of signed Bitcoin transactions"
keywords = ["bitcoin", "transaction", "backup", "bech32", "codex32"]
categories = ["cryptography::cryptocurrencies", "encoding"]

[lints]
workspace = true

[lib]
name = "mt_codec"

[dependencies]
bitcoin = "0.32"
thiserror = "2.0"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
