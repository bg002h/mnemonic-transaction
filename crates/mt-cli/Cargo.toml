[package]
name = "mt-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The mt CLI — turn a signed Bitcoin transaction into engravable form: mt1 strings to engrave by hand, or a record for `me` to pack for a SeedHammer II. And read it back."

[lints]
workspace = true

[[bin]]
name = "mt"
path = "src/main.rs"

[dependencies]
mt-codec = { path = "../mt-codec", version = "0.1.0" }
bitcoin = "0.32"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"
