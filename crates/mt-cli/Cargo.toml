[package]
name = "mt-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The mt CLI — turn a signed Bitcoin transaction into engravable form: mt1 strings to engrave by hand, or a record for `me` to pack for a SeedHammer II. And read it back."

[lints]
workspace = true

[[bin]]
name = "mt"
path = "src/main.rs"

[dependencies]
mt-codec = { path = "../mt-codec", version = "0.2.0" }
# THE SHARED IO/SAFETY MECHANISM (P1), from crates.io. mnemonic-io-lib 0.1.3
# is the first release published from mnemonic-engrave master, so a fresh CI
# checkout resolves it with no sibling repository and no git source (Brian
# 2026-11-24; the same registry rationale as md-cli). 0.1.3 writes through a
# temp file and a rename, so a failed write leaves the old file as it was, and
# adds `same_file`.
mnemonic-io-lib = "0.1.3"
bitcoin = "0.32"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
