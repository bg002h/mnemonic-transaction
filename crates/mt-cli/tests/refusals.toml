# Every refusal `mt` v0.1 can emit, and the test that proves it fires.
#
# THIS FILE IS THE INPUT TO THE EXHAUSTIVENESS GATE, and it is a LIST rather
# than a parser over §8, for three reasons that are each a defect somebody hit:
#
#   1. §8's numbering contains NON-refusals. §8.2 (script validity, removed) and
#      §8.8 are numbered items that are not v0.1 refusals; §8.7 and §8.7c are
#      pointers to deferred `mt qr` material. A script counting `^\d+[a-z]?\. `
#      in §8 would demand tests for four things that cannot fire.
#   2. A REAL REFUSAL LIVES OUTSIDE §8's NUMBERING. §6a's value-mismatch refusal
#      is normative and is not a numbered §8 item, so a §8-numbering script is
#      STRUCTURALLY UNABLE TO SEE IT — the one class an exhaustiveness gate
#      exists to prevent. It is the last entry here for exactly that reason.
#   3. The spec is in a DIFFERENT REPOSITORY (mnemonic-engrave/design/) from the
#      crate under test, so a parser had no file to read either.
#
# A parser over prose in another repo breaks on a heading edit. A checked-in
# list breaks only when someone adds a refusal and forgets its entry — which is
# exactly the failure to catch. Adding a refusal to the spec therefore requires
# touching this file, and THE COUPLING IS THE MECHANISM, not an inconvenience.
#
# THREE FIELDS, and the third is not decoration:
#
#   spec   where it is ruled
#   test   the test that proves it fires, in tests/refusals.rs
#   check  path::symbol -- the function `scripts/mutate-refusals.sh` neuters to
#          prove the test is not vacuous. A two-field schema would name the rule
#          and the test and give the mutation script nothing to point at, so the
#          locating mechanism would get invented: grep for a message string,
#          match a test name to a function, or edit by line number. All three
#          break silently on a refactor, and the last mutates whatever has moved
#          into that line.
#
# EVERY `check` IS A `fn(..) -> Result<(), Refusal>`, so one mutation shape --
# insert `return Ok(());` at the top of the body -- neuters any of them.

[[refusal]]
spec  = "§8.1"
test  = "refuses_an_unfinalized_psbt"
check = "src/validate.rs::finalized_guard_psbt"

[[refusal]]
spec  = "§8.2b"
test  = "refuses_an_absurd_fee_rate"
check = "src/validate.rs::value_guard"

# §8.2b RULES FOUR CHECKS UNDER ONE NUMBER, so it carries four entries. The
# spec's own minimum is "inputs >= outputs", "an absurdly HIGH fee", "no
# duplicate outpoints", and "vin non-empty" -- and the last two are the ones a
# reader skims past, because they sound impossible rather than merely rare.
[[refusal]]
spec  = "§8.2b"
test  = "refuses_outputs_that_exceed_inputs"
check = "src/validate.rs::value_guard"

[[refusal]]
spec  = "§8.2b"
test  = "refuses_a_duplicate_outpoint"
check = "src/validate.rs::value_guard"

[[refusal]]
spec  = "§8.2b"
test  = "refuses_an_empty_vin"
check = "src/validate.rs::value_guard"

[[refusal]]
spec  = "§8.2d"
test  = "refuses_a_non_witness_utxo_that_does_not_hash_to_its_input"
check = "src/validate.rs::non_witness_utxo_guard"

[[refusal]]
spec  = "§8.2e"
test  = "refuses_unrecognised_input_naming_what_was_seen"
check = "src/input.rs::recognised_guard"

# The one genuinely AMBIGUOUS input: valid hex and a PSBT at once. It had a
# test in encode.rs and no entry here for the whole of P5 -- and the coverage
# gate could not see it, because it scanned only refusals.rs. Both halves fixed:
# the gate now reads every suite, and this rule now has a check to mutate.
[[refusal]]
spec  = "§8.2e"
test  = "refuses_a_hex_encoded_psbt_by_name"
check = "src/input.rs::hex_psbt_guard"

[[refusal]]
spec  = "§8.2f"
test  = "refuses_a_transaction_passed_as_a_command_line_argument"
check = "src/validate.rs::command_line_guard"

[[refusal]]
spec  = "§8.3"
test  = "refuses_an_unsigned_raw_transaction"
check = "src/validate.rs::finalized_guard_raw"

[[refusal]]
spec  = "§8.5"
test  = "refuses_a_spent_input_whose_parent_confirmed"
check = "src/validate.rs::spent_input_guard"

[[refusal]]
spec  = "§8.6a"
test  = "refuses_a_signature_that_is_not_sighash_all"
check = "src/validate.rs::sighash_all_guard"

[[refusal]]
spec  = "§8.6b"
test  = "refuses_a_satisfaction_carrying_no_signature"
check = "src/validate.rs::has_signature_guard"

[[refusal]]
spec  = "§8.7b"
test  = "refuses_over_the_chunk_ceiling"
check = "src/validate.rs::chunk_ceiling_guard"

[[refusal]]
spec  = "§8.9"
test  = "refuses_ms1_without_echoing_any_of_it"
check = "src/validate.rs::secret_guard"

# NORMATIVE AND OUTSIDE §8's NUMBERING. §6a rules that mt compares the value
# gettxout returns against the PSBT's own UTXO record and refuses on mismatch,
# naming both numbers. Since §8.2's removal the chain's answer is the only value
# check mt has for a segwit input, and an earlier draft acted only on whether
# the result was null -- throwing it away.
[[refusal]]
spec  = "§6a"
test  = "refuses_a_value_that_disagrees_with_the_chain"
check = "src/validate.rs::value_mismatch_guard"

# BOTH FOUND BY WIDENING THE COVERAGE GATE TO EVERY SUITE, 2026-08-24. Each had
# a passing test in another file and no entry here, so neither had ever been
# mutation-controlled. They are refusals mt emits; the seeded list could not
# contain them because it was drawn from the plan's §8 table.
[[refusal]]
spec  = "§3b"
test  = "decode_refuses_all_elided_input"
check = "src/read_strings.rs::restore_elided"

[[refusal]]
spec  = "§8.2c"
test  = "input_value_must_be_per_input"
check = "src/main.rs::parse_input_values"

# A second §8.2e test, in encode.rs. Same rule, same check, different input --
# and the ledger keys on the TEST, so both are declared rather than one hidden.
[[refusal]]
spec  = "§8.2e"
test  = "unrecognised_input_shows_the_bytes"
check = "src/input.rs::recognised_guard"

# §1.1's LAST CHECK, and the one with no code behind it until two independent
# reviews found it from opposite directions. verify printed "transaction
# re-derives" on every run without ever deriving it, and decode emitted the
# WRONG transaction's broadcastable hex for a forged set.
[[refusal]]
spec  = "§1.1"
test  = "verify_refuses_a_set_that_does_not_re_derive_its_id"
check = "src/main.rs::content_id_guard"

# §8.2c's AMOUNT parsing, a distinct guard from its per-input requirement:
# `--input-value 0:inf` panicked, and `-5`/`NaN` produced a silent nonsense
# value that tripped §8.2b, so the operator got a refusal about their outputs
# when the fault was what they had just typed.
[[refusal]]
spec  = "§8.2c"
test  = "a_hostile_input_value_is_refused_by_name_and_never_panics"
check = "src/main.rs::parse_btc"

# §1.1e's LENGTH CHECK. A dropped character reported `chunk 3 of 6 is missing` --
# an accusation about the operator's steel, sending them to hunt for a plate
# sitting in front of them. BCH repairs substitutions; it cannot repair a length.
[[refusal]]
spec  = "§1.1e"
test  = "a_dropped_character_is_named_as_a_length_error_not_a_missing_plate"
check = "src/read_strings.rs::length_report"

# THE FLAGS THAT QUIETLY DID NOTHING. All three were found by an adversarial
# review typing what a person mistypes, and each was silent rather than wrong --
# which is why no test had ever caught them.
[[refusal]]
spec  = "§1.1e"
test  = "a_non_whitespace_separator_is_refused_before_anything_is_cut"
check = "src/main.rs::separator_guard"

[[refusal]]
spec  = "§8.2c"
test  = "a_repeated_input_value_index_is_refused"
check = "src/main.rs::check_input_value_indices"

[[refusal]]
spec  = "§8.2c"
test  = "an_input_value_index_that_names_no_input_is_refused"
check = "src/main.rs::input_index_range_guard"

# THE CONTROL for §8.2f's charset test. My own widening of the recogniser
# refused a legitimate FILENAME beginning `mt1`; this asserts the fix narrowed
# it rather than disabling it, so it belongs beside the rule it guards.
[[refusal]]
spec  = "§8.2f"
test  = "a_real_mt1_string_on_the_command_line_is_still_refused"
check = "src/validate.rs::command_line_guard"

# §8.2c's ACTUAL per-input requirement -- `require_psbt_input_values`, which is
# called on every PSBT and had NO test and NO entry. An entry I added earlier
# claimed to cover it and named `parse_input_values`, a DIFFERENT guard with a
# confusingly similar name. A ledger whose entries are not read back is a
# ledger, not a gate.
[[refusal]]
spec  = "§8.2c"
test  = "refuses_a_psbt_input_with_no_utxo_record_and_no_supplied_value"
check = "src/validate.rs::require_psbt_input_values"

# §10.10: a pasted TXID is recognisable as such. 64 hex characters is an easy
# thing to reach for -- it is what an explorer shows and what mt's own TX row
# prints -- and it fell through to "valid hex but does not parse", which sends
# the operator to look at the wrong thing.
[[refusal]]
spec  = "§10.10"
test  = "refuses_a_pasted_txid_by_name"
check = "src/main.rs::txid_paste_guard"

# §10.10's txid guard on the READING verbs. A txid reaches them as easily as
# encode -- more easily, since `inspect` is the verb a recoverer is pointed at
# and a txid is what a block explorer shows them.
[[refusal]]
spec  = "§10.10"
test  = "a_pasted_txid_is_named_on_every_verb"
check = "src/main.rs::txid_paste_guard"

# A flag that cannot work must REFUSE rather than sit inert. `--json` was wired
# into `inspect` alone, so on three verbs it parsed and did nothing -- and a
# caller who asks for machine output and gets prose with exit 0 will parse
# something out of the prose.
[[refusal]]
spec  = "§10.10"
test  = "json_works_where_there_is_a_report_and_refuses_where_there_is_not"
check = "src/main.rs::json_unsupported_guard"

# §8.2g's OTHER HALF, ruled 2026-08-24 from the Goal 1 journey walk (F-244).
# `mt` warned that the INPUT file was readable by others and then wrote the
# strings -- the engraving itself -- to a file it never mentioned again.
#
# WARN ON INPUT, REFUSE ON OUTPUT: an input's exposure has already happened, so
# refusing prevents nothing; an output's has not, so declining to create it badly
# is the whole remedy.
[[refusal]]
spec  = "§8.2h"
test  = "refuses_a_world_readable_stdout"
check = "src/validate.rs::world_readable_stdout_guard"
